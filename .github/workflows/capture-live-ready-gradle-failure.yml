name: capture-live-ready-gradle-failure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'wsg138/EnthusiaToiletFlush'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          d=.github/pr6-runtime
          mkdir -p /tmp/c
          cp "$d/live-ready-final.part00" /tmp/c/chunk00
          cp "$d/live-ready-final.chunk01" /tmp/c/chunk01
          cp "$d/live-ready-final.chunk02" /tmp/c/chunk02
          cp "$d/live-ready-final.chunk03" /tmp/c/chunk03
          tr -d '\r\n' < "$d/live-ready-final.part03-04" > /tmp/p34
          tr -d '\r\n' < "$d/live-ready-final.part05-06" > /tmp/p56
          tr -d '\r\n' < "$d/live-ready-final.part07-08" > /tmp/p78
          tr -d '\r\n' < "$d/live-ready-final.part09-10" > /tmp/p910
          dd if=/tmp/p34 of=/tmp/c/chunk04 bs=1 skip=7000 count=7000 status=none
          dd if=/tmp/p56 of=/tmp/c/chunk05 bs=1 count=7000 status=none
          dd if=/tmp/p56 of=/tmp/c/chunk06 bs=1 skip=7000 count=7000 status=none
          dd if=/tmp/p78 of=/tmp/c/chunk07 bs=1 count=7000 status=none
          cp "$d/live-ready-final.chunk08" /tmp/c/chunk08
          dd if=/tmp/p910 of=/tmp/c/chunk09 bs=1 count=7000 status=none
          cp "$d/live-ready-final.chunk10" /tmp/c/chunk10
          cp "$d/live-ready-final.chunk11" /tmp/c/chunk11
          cp "$d/live-ready-final.chunk12" /tmp/c/chunk12
          cat /tmp/c/chunk* > /tmp/fix.b64
          echo '94446bb822910287d99a1a36eecc27521b295e9651928dab6ef9f03fa98476a9  /tmp/fix.b64' | sha256sum -c -
          base64 --decode /tmp/fix.b64 | gzip -dc > /tmp/fix.patch
          echo '29927d05a9f35256797a65b45a46c2804df1ae3776d16fb3b220ded44a70d9fc  /tmp/fix.patch' | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply --whitespace=error-all /tmp/fix.patch
      - name: Run Gradle and capture concise failure evidence
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew clean :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon --console=plain --stacktrace -PreleaseVersion=0.1.4-live-candidate 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          {
            echo "gradle_exit=$status"
            echo
            echo '=== matched failure lines ==='
            grep -nE '(^e: |^FAILURE:|^\* What went wrong:|Execution failed for task|> Task .*FAILED| FAILED$|Caused by:|AssertionError|Compilation error|There were failing tests)' /tmp/gradle.log | tail -n 250 || true
            echo
            echo '=== failing test XML ==='
            grep -R -n -E '<failure|<error' velocity/build/test-results paper-companion/build/test-results 2>/dev/null | head -n 300 || true
            echo
            echo '=== log tail ==='
            tail -n 350 /tmp/gradle.log
          } > /tmp/gradle-failure.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic only
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .github/pr6-runtime
          cp /tmp/gradle-failure.txt .github/pr6-runtime/gradle-failure.txt
          git config user.name 'Enthusia repository agent'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/pr6-runtime/gradle-failure.txt
          git commit -m 'chore: capture live-readiness Gradle failure'
          git push origin HEAD:main
      - name: Unexpected success
        if: steps.gradle.outputs.status == '0'
        run: echo 'The diagnostic build succeeded; inspect the gating workflow configuration.'
