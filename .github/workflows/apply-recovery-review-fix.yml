name: Apply recovery review fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'wsg138/EnthusiaToiletFlush' && github.head_ref == 'agent/recovery-review-fix-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 .github/recovery-fix/apply.py

      - name: Validate
        run: |
          chmod +x ./gradlew
          ./gradlew :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon

      - name: Commit validated source-only patch
        run: |
          rm -rf .github/recovery-fix .github/workflows/apply-recovery-review-fix.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt \
                  velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartRecoveryRegressionTest.kt \
                  docs/network-restarts.md docs/requirements.md \
                  .github/recovery-fix .github/workflows/apply-recovery-review-fix.yml
          git commit -m "fix: stop stale review plans returning after restart"
          git push origin HEAD:${{ github.head_ref }}
