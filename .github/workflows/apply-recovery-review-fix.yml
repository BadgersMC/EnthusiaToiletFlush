name: Apply recovery review fix

on:
  push:
    branches:
      - agent/recovery-review-fix-bootstrap

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'wsg138/EnthusiaToiletFlush'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/recovery-review-fix-bootstrap
          fetch-depth: 0

      - name: Apply reviewed source and test changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new))

          service = "velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt"
          tests = "velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartServiceTest.kt"
          docs = "docs/network-restarts.md"
          requirements = "docs/requirements.md"

          replace_once(
              service,
              '''    private fun refreshMaintenance(plan: RestartPlan) {
                  if (
                      !plan.maintenanceEnabled ||
                      plan.state !in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING, PlanState.DISPATCHING, PlanState.NEEDS_REVIEW)
                  ) return
                  control.setMaintenance(true, Duration.ofSeconds(config().maintenanceFailureExpirySeconds))
              }
          ''',
              '''    private fun refreshMaintenance(plan: RestartPlan) {
                  if (
                      !plan.maintenanceEnabled ||
                      plan.state !in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING, PlanState.DISPATCHING)
                  ) return
                  control.setMaintenance(true, Duration.ofSeconds(config().maintenanceFailureExpirySeconds))
              }
          ''',
          )

          replace_once(
              service,
              '''    @Synchronized
              private fun requireReview(plan: RestartPlan, detail: String) {
                  plan.failure = detail
                  plan.state = PlanState.NEEDS_REVIEW
                  if (plan.type != PlanType.SERVER) {
                      control.setMaintenance(true, Duration.ofSeconds(config().maintenanceFailureExpirySeconds))
                      plan.maintenanceEnabled = true
                  } else {
                      plan.maintenanceEnabled = false
                  }
                  audit(plan, "requires operator review: $detail")
                  save()
              }
          ''',
              '''    @Synchronized
              private fun requireReview(plan: RestartPlan, detail: String) {
                  plan.failure = detail
                  plan.state = PlanState.NEEDS_REVIEW
                  if (plan.type != PlanType.SERVER) {
                      // Keep the immediate failure window fail-closed, but do not refresh it
                      // forever. The unresolved plan still blocks overlapping restarts.
                      control.setMaintenance(true, Duration.ofSeconds(config().maintenanceFailureExpirySeconds))
                  }
                  plan.maintenanceEnabled = false
                  audit(plan, "requires operator review: $detail")
                  save()
              }
          ''',
          )

          replace_once(
              service,
              '''            when {
                      plan.state == PlanState.NEEDS_REVIEW -> {
                          plan.maintenanceEnabled = plan.type != PlanType.SERVER
                      }
                      plan.state == PlanState.DISPATCHING -> recoverDispatching(plan, now)
          ''',
              '''            when {
                      plan.state in setOf(
                          PlanState.COMPLETED,
                          PlanState.CANCELLED,
                          PlanState.FAILED,
                          PlanState.MISSED,
                      ) -> {
                          // actionStarted is durable execution history, not proof that a
                          // terminal plan became active again after a proxy restart.
                          plan.maintenanceEnabled = false
                          plan.executionDeadlineAt = null
                          if (plan.state == PlanState.COMPLETED) plan.failure = ""
                      }
                      plan.state == PlanState.NEEDS_REVIEW && plan.completedAt != null -> {
                          // Earlier builds could overwrite a verified COMPLETED record with
                          // NEEDS_REVIEW solely because actionStarted remained true. A
                          // persisted completion timestamp proves the terminal transition
                          // already occurred, so repair that legacy regression once.
                          plan.state = PlanState.COMPLETED
                          plan.failure = ""
                          plan.maintenanceEnabled = false
                          plan.executionDeadlineAt = null
                          plan.targetResults.putIfAbsent(
                              "recovery",
                              "restored completed plan after legacy recovery regression",
                          )
                      }
                      plan.state == PlanState.NEEDS_REVIEW -> {
                          // Review still blocks overlapping restart plans, but a historical
                          // review record must not take the whole network offline forever.
                          plan.maintenanceEnabled = false
                      }
                      plan.state == PlanState.DISPATCHING -> recoverDispatching(plan, now)
          ''',
          )

          replace_once(
              service,
              '''                plan.state in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING) || plan.actionStarted -> {
          ''',
              '''                plan.state in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING) ||
                          (plan.active() && plan.actionStarted) -> {
          ''',
          )

          replace_once(
              service,
              '''            it.maintenanceEnabled && it.state in setOf(
                          PlanState.PREFLIGHT,
                          PlanState.TRANSFERRING,
                          PlanState.DISPATCHING,
                          PlanState.NEEDS_REVIEW,
                      )
          ''',
              '''            it.maintenanceEnabled && it.state in setOf(
                          PlanState.PREFLIGHT,
                          PlanState.TRANSFERRING,
                          PlanState.DISPATCHING,
                      )
          ''',
          )

          replace_once(
              tests,
              '''    @Test
              fun `needs review remains fail closed and blocks overlapping schedules`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val review = RestartPlan(
                      type = PlanType.PROXY,
                      targets = emptySet(),
                      createdAt = now.minusSeconds(30),
                      executionAt = now.minusSeconds(10),
                      warningAt = now.minusSeconds(40),
                      creator = "console",
                      state = PlanState.NEEDS_REVIEW,
                      maintenanceEnabled = false,
                      failure = "uncertain",
                  )
                  store.save(listOf(review))
                  val control = FakeControl()
                  val service = service(control, store = store)

                  service.tick(now.plusSeconds(120))
                  assertThat(control.maintenanceEnables).isGreaterThanOrEqualTo(2)
                  org.assertj.core.api.Assertions.assertThatThrownBy {
                      service.createManual(PlanType.PROXY, emptySet(), now.plusSeconds(600), now, "", "console", false)
                  }.isInstanceOf(IllegalArgumentException::class.java)
              }
          ''',
              '''    @Test
              fun `recovered review blocks overlapping schedules without restoring login maintenance`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val review = RestartPlan(
                      type = PlanType.PROXY,
                      targets = emptySet(),
                      createdAt = now.minusSeconds(30),
                      executionAt = now.minusSeconds(10),
                      warningAt = now.minusSeconds(40),
                      creator = "console",
                      state = PlanState.NEEDS_REVIEW,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      failure = "uncertain",
                  )
                  store.save(listOf(review))
                  val control = FakeControl()
                  val service = service(control, store = store)

                  service.tick(now.plusSeconds(120))
                  assertThat(control.maintenanceEnables).isZero()
                  assertThat(service.allPlans().single().state).isEqualTo(PlanState.NEEDS_REVIEW)
                  org.assertj.core.api.Assertions.assertThatThrownBy {
                      service.createManual(PlanType.PROXY, emptySet(), now.plusSeconds(600), now, "", "console", false)
                  }.isInstanceOf(IllegalArgumentException::class.java)
              }

              @Test
              fun `completed destructive plan remains terminal across repeated recovery`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val completed = RestartPlan(
                      type = PlanType.NETWORK,
                      targets = setOf(hub, smp),
                      createdAt = now.minusSeconds(120),
                      executionAt = now.minusSeconds(60),
                      warningAt = now.minusSeconds(180),
                      creator = "console",
                      state = PlanState.COMPLETED,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      completedAt = now.minusSeconds(30),
                  )
                  store.save(listOf(completed))

                  val first = service(FakeControl(), store = store)
                  val secondControl = FakeControl()
                  val second = service(secondControl, store = store)

                  assertThat(first.allPlans().single().state).isEqualTo(PlanState.COMPLETED)
                  assertThat(second.allPlans().single().state).isEqualTo(PlanState.COMPLETED)
                  assertThat(second.allPlans().single().maintenanceEnabled).isFalse()
                  assertThat(secondControl.maintenanceEnables).isZero()
              }

              @Test
              fun `legacy completed review is repaired from its completion timestamp`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val regressed = RestartPlan(
                      type = PlanType.PROXY,
                      targets = emptySet(),
                      createdAt = now.minusSeconds(120),
                      executionAt = now.minusSeconds(60),
                      warningAt = now.minusSeconds(180),
                      creator = "console",
                      state = PlanState.NEEDS_REVIEW,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      completedAt = now.minusSeconds(30),
                      failure = "execution was interrupted after a destructive action may have started",
                  )
                  store.save(listOf(regressed))
                  val control = FakeControl()

                  val recovered = service(control, store = store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.COMPLETED)
                  assertThat(recovered.failure).isEmpty()
                  assertThat(recovered.maintenanceEnabled).isFalse()
                  assertThat(recovered.targetResults["recovery"]).contains("legacy recovery regression")
                  assertThat(control.maintenanceEnables).isZero()
              }

              @Test
              fun `resolved review cannot return after another proxy recovery`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val review = RestartPlan(
                      type = PlanType.NETWORK,
                      targets = setOf(hub, smp),
                      createdAt = now.minusSeconds(120),
                      executionAt = now.minusSeconds(60),
                      warningAt = now.minusSeconds(180),
                      creator = "console",
                      state = PlanState.NEEDS_REVIEW,
                      actionStarted = true,
                      failure = "uncertain",
                  )
                  store.save(listOf(review))
                  val first = service(FakeControl(), store = store)
                  assertThat(first.resolveReview(review.id.toString().take(8))).isTrue()

                  val recovered = service(FakeControl(), store = store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.FAILED)
                  assertThat(recovered.failure).startsWith("operator reconciled:")
                  assertThat(recovered.maintenanceEnabled).isFalse()
              }

              @Test
              fun `new review gets a bounded maintenance window that is not refreshed`() {
                  val control = FakeControl()
                  val now = Instant.now()
                  val service = service(control, executionTimeout = Duration.ofSeconds(10))
                  val plan = service.createManual(
                      PlanType.PROXY,
                      emptySet(),
                      now.plusSeconds(1),
                      now,
                      "",
                      "console",
                      false,
                  )
                  service.tick(now.plusSeconds(2))
                  service.tick(now.plusSeconds(20))
                  assertThat(plan.state).isEqualTo(PlanState.NEEDS_REVIEW)
                  val maintenanceCallsAfterReview = control.maintenanceEnables

                  service.tick(now.plusSeconds(21))
                  service.tick(now.plusSeconds(120))

                  assertThat(control.maintenanceEnables).isEqualTo(maintenanceCallsAfterReview)
              }
          ''',
          )

          replace_once(
              tests,
              '''        prepareBackendHandoff: (ServerId, UUID) -> Boolean = { _, _ -> true },
              ): NetworkRestartService {
          ''',
              '''        prepareBackendHandoff: (ServerId, UUID) -> Boolean = { _, _ -> true },
                  executionTimeout: Duration = Duration.ofMinutes(10),
              ): NetworkRestartService {
          ''',
          )

          replace_once(
              tests,
              '''            currentProxyBootId = proxyBootId,
                  )
              }
          ''',
              '''            currentProxyBootId = proxyBootId,
                      executionTimeout = { executionTimeout },
                  )
              }
          ''',
          )

          replace_once(
              docs,
              '''interrupted during preflight, transfer, or dispatch are marked
              `NEEDS_REVIEW` and are never replayed automatically, preventing restart loops.
          ''',
              '''interrupted during preflight, transfer, or dispatch are marked
              `NEEDS_REVIEW` and are never replayed automatically, preventing restart loops.
              Review records continue to block overlapping restart plans, but they do not
              refresh the global login-maintenance gate indefinitely. A newly detected
              proxy or network uncertainty receives one bounded
              `maintenance-failure-expiry-seconds` window; recovered historical review
              records leave player access open. Startup also repairs records that an
              affected earlier build changed from `COMPLETED` to `NEEDS_REVIEW` when their
              persisted completion timestamp proves the restart had already completed.
          ''',
          )

          replace_once(
              requirements,
              '''- REQ-062: If the companion plugin is missing on the target server when a restart is requested, then the system shall refuse to arm the restart and log an error.
          ''',
              '''- REQ-062: If the companion plugin is missing on the target server when a restart is requested, then the system shall refuse to arm the restart and log an error.
              - REQ-063: A `NEEDS_REVIEW` plan shall block overlapping restart scheduling without refreshing global login maintenance beyond `maintenance-failure-expiry-seconds`; recovery shall preserve terminal plan states even when their durable `actionStarted` history remains true, and shall repair a legacy `NEEDS_REVIEW` record when a persisted completion timestamp proves it had already completed.
          ''',
          )
          PY

      - name: Validate the fix
        run: |
          chmod +x ./gradlew
          ./gradlew :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon

      - name: Commit the validated patch
        run: |
          rm .github/workflows/apply-recovery-review-fix.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt \
                  velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartServiceTest.kt \
                  docs/network-restarts.md docs/requirements.md \
                  .github/workflows/apply-recovery-review-fix.yml
          git commit -m "fix: stop stale review plans locking the network"
          git push origin HEAD:agent/recovery-review-fix-bootstrap
