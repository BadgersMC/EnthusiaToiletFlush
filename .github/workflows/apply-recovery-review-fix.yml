name: Apply recovery review fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'wsg138/EnthusiaToiletFlush' && github.head_ref == 'agent/recovery-review-fix-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt')
          text = path.read_text()

          replacements = [
              (
                  '''    private fun conflicts(left: RestartPlan, right: RestartPlan): Boolean =
                      if (left.type != PlanType.SERVER || right.type != PlanType.SERVER) true else left.targets.any(right.targets::contains)

                  private fun recover() {
          ''',
                  '''    private fun conflicts(left: RestartPlan, right: RestartPlan): Boolean =
                      if (left.type != PlanType.SERVER || right.type != PlanType.SERVER) true else left.targets.any(right.targets::contains)

                  private fun isLegacyRecoveryRegression(plan: RestartPlan): Boolean =
                      plan.failure == LEGACY_INTERRUPTED_FAILURE &&
                          plan.completedAt == null &&
                          plan.executionDeadlineAt == null &&
                          plan.dispatchedActionKeys.isEmpty() &&
                          plan.acceptedActionKeys.isEmpty() &&
                          plan.baselineBootIds.isEmpty() &&
                          plan.proxyBaselineBootId == null &&
                          plan.targetResults.isEmpty()

                  private fun recover() {
          ''',
              ),
              (
                  '''            when {
                          plan.state == PlanState.NEEDS_REVIEW -> {
                              plan.maintenanceEnabled = plan.type != PlanType.SERVER
                          }
                          plan.state == PlanState.DISPATCHING -> recoverDispatching(plan, now)
          ''',
                  '''            when {
                          plan.state in setOf(
                              PlanState.COMPLETED,
                              PlanState.CANCELLED,
                              PlanState.FAILED,
                              PlanState.MISSED,
                          ) -> {
                              // actionStarted is durable history, not evidence that a
                              // terminal plan became active again after proxy startup.
                              plan.maintenanceEnabled = false
                              plan.executionDeadlineAt = null
                          }
                          plan.state == PlanState.NEEDS_REVIEW && plan.completedAt != null -> {
                              // Affected builds could overwrite a verified COMPLETED plan
                              // solely because actionStarted remained true. completedAt is
                              // written by the terminal transition, so restore it once.
                              plan.state = PlanState.COMPLETED
                              plan.failure = ""
                              plan.maintenanceEnabled = false
                              plan.executionDeadlineAt = null
                              plan.targetResults.putIfAbsent(
                                  "recovery",
                                  "restored completed plan after legacy recovery regression",
                              )
                          }
                          plan.state == PlanState.NEEDS_REVIEW && isLegacyRecoveryRegression(plan) -> {
                              // The known regression also produced records with the exact
                              // legacy failure but none of the durable evidence written by
                              // a real dispatch path. Close only that impossible state.
                              plan.state = PlanState.FAILED
                              plan.failure = "legacy recovery regression reconciled"
                              plan.maintenanceEnabled = false
                              plan.executionDeadlineAt = null
                          }
                          plan.state == PlanState.NEEDS_REVIEW -> {
                              plan.maintenanceEnabled = plan.type != PlanType.SERVER
                          }
                          plan.state == PlanState.DISPATCHING -> recoverDispatching(plan, now)
          ''',
              ),
              (
                  '''                plan.state in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING) || plan.actionStarted -> {
                      plan.state = PlanState.NEEDS_REVIEW
                      plan.failure = "execution was interrupted after a destructive action may have started"
          ''',
                  '''                plan.state in setOf(PlanState.PREFLIGHT, PlanState.TRANSFERRING) ||
                          (plan.active() && plan.actionStarted) -> {
                      plan.state = PlanState.NEEDS_REVIEW
                      plan.failure = LEGACY_INTERRUPTED_FAILURE
          ''',
              ),
              (
                  '''    companion object {
                      private const val MAX_TERMINAL_HISTORY = 500
                  }
          ''',
                  '''    companion object {
                      private const val LEGACY_INTERRUPTED_FAILURE =
                          "execution was interrupted after a destructive action may have started"
                      private const val MAX_TERMINAL_HISTORY = 500
                  }
          ''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Add recovery regression tests
        run: |
          cat > velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartRecoveryRegressionTest.kt <<'EOF'
          package com.badgersmc.queuerestart.velocity.application.network

          import com.badgersmc.queuerestart.velocity.application.ports.ExternalRestartExecutor
          import com.badgersmc.queuerestart.velocity.application.ports.NetworkControlPort
          import com.badgersmc.queuerestart.velocity.application.ports.NetworkRestartConfig
          import com.badgersmc.queuerestart.velocity.application.ports.PowerActionResult
          import com.badgersmc.queuerestart.velocity.application.ports.RestartNotice
          import com.badgersmc.queuerestart.velocity.application.ports.RestartPlanStore
          import com.badgersmc.queuerestart.velocity.application.ports.TransferSummary
          import com.badgersmc.queuerestart.velocity.application.schedule.SchedCommandResult
          import com.badgersmc.queuerestart.velocity.domain.id.ServerId
          import com.badgersmc.queuerestart.velocity.domain.plan.PlanState
          import com.badgersmc.queuerestart.velocity.domain.plan.PlanType
          import com.badgersmc.queuerestart.velocity.domain.plan.RestartPlan
          import org.assertj.core.api.Assertions.assertThat
          import org.junit.jupiter.api.Test
          import java.time.Duration
          import java.time.Instant
          import java.util.UUID
          import java.util.concurrent.CompletableFuture
          import java.util.concurrent.CompletionStage
          import java.util.concurrent.ConcurrentHashMap

          class NetworkRestartRecoveryRegressionTest {
              private val hub = ServerId("HUB")
              private val smp = ServerId("SMP")

              @Test
              fun `terminal destructive plans remain terminal across repeated recovery`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val completed = plan(
                      PlanType.NETWORK,
                      PlanState.COMPLETED,
                      now,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      completedAt = now.minusSeconds(30),
                  )
                  store.save(listOf(completed))

                  val first = service(FakeControl(), store).allPlans().single()
                  val secondControl = FakeControl()
                  val second = service(secondControl, store).allPlans().single()

                  assertThat(first.state).isEqualTo(PlanState.COMPLETED)
                  assertThat(second.state).isEqualTo(PlanState.COMPLETED)
                  assertThat(second.maintenanceEnabled).isFalse()
                  assertThat(secondControl.maintenanceEnables).isZero()
              }

              @Test
              fun `legacy completed review restores its completed state`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val regressed = plan(
                      PlanType.PROXY,
                      PlanState.NEEDS_REVIEW,
                      now,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      completedAt = now.minusSeconds(30),
                      failure = LEGACY_FAILURE,
                  )
                  store.save(listOf(regressed))
                  val control = FakeControl()

                  val recovered = service(control, store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.COMPLETED)
                  assertThat(recovered.failure).isEmpty()
                  assertThat(recovered.maintenanceEnabled).isFalse()
                  assertThat(recovered.targetResults["recovery"]).contains("legacy recovery regression")
                  assertThat(control.maintenanceEnables).isZero()
              }

              @Test
              fun `legacy review without durable dispatch evidence closes as failed`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val regressed = plan(
                      PlanType.NETWORK,
                      PlanState.NEEDS_REVIEW,
                      now,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      failure = LEGACY_FAILURE,
                  )
                  store.save(listOf(regressed))
                  val control = FakeControl()

                  val recovered = service(control, store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.FAILED)
                  assertThat(recovered.failure).isEqualTo("legacy recovery regression reconciled")
                  assertThat(recovered.maintenanceEnabled).isFalse()
                  assertThat(control.maintenanceEnables).isZero()
              }

              @Test
              fun `operator resolved review cannot return on later recovery`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val review = plan(
                      PlanType.NETWORK,
                      PlanState.NEEDS_REVIEW,
                      now,
                      actionStarted = true,
                      failure = "uncertain",
                  )
                  store.save(listOf(review))
                  val first = service(FakeControl(), store)
                  assertThat(first.resolveReview(review.id.toString().take(8))).isTrue()

                  val recovered = service(FakeControl(), store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.FAILED)
                  assertThat(recovered.failure).startsWith("operator reconciled:")
                  assertThat(recovered.maintenanceEnabled).isFalse()
              }

              @Test
              fun `review with durable dispatch evidence remains fail closed`() {
                  val store = MemoryStore()
                  val now = Instant.now()
                  val review = plan(
                      PlanType.PROXY,
                      PlanState.NEEDS_REVIEW,
                      now,
                      actionStarted = true,
                      maintenanceEnabled = true,
                      failure = LEGACY_FAILURE,
                  )
                  review.dispatchedActionKeys += "${review.id}:proxy"
                  store.save(listOf(review))
                  val control = FakeControl()

                  val recovered = service(control, store).allPlans().single()

                  assertThat(recovered.state).isEqualTo(PlanState.NEEDS_REVIEW)
                  assertThat(recovered.maintenanceEnabled).isTrue()
                  assertThat(control.maintenanceEnables).isGreaterThanOrEqualTo(1)
              }

              private fun plan(
                  type: PlanType,
                  state: PlanState,
                  now: Instant,
                  actionStarted: Boolean = false,
                  maintenanceEnabled: Boolean = false,
                  completedAt: Instant? = null,
                  failure: String = "",
              ): RestartPlan = RestartPlan(
                  type = type,
                  targets = if (type == PlanType.PROXY) emptySet() else setOf(hub, smp),
                  createdAt = now.minusSeconds(120),
                  executionAt = now.minusSeconds(60),
                  warningAt = now.minusSeconds(180),
                  creator = "console",
                  state = state,
                  actionStarted = actionStarted,
                  maintenanceEnabled = maintenanceEnabled,
                  completedAt = completedAt,
                  failure = failure,
              )

              private fun service(control: FakeControl, store: RestartPlanStore): NetworkRestartService {
                  val config = NetworkRestartConfig.disabled().copy(
                      enabled = true,
                      serverIds = mapOf(hub to "hub1234", smp to "smp1234"),
                      proxyServerId = "proxy1234",
                      members = listOf(hub, smp),
                      hubServers = listOf(hub),
                  )
                  return NetworkRestartService(
                      config = { config },
                      schedules = { emptyList() },
                      executor = FakeExecutor(),
                      control = control,
                      store = store,
                      backendArm = { server, seconds, _ -> SchedCommandResult.Armed(server, seconds) },
                      backendCancel = {},
                      audit = { _, _ -> },
                  )
              }

              private class FakeExecutor : ExternalRestartExecutor {
                  override val name = "fake"
                  override fun preflight(panelServerId: String): CompletionStage<PowerActionResult> =
                      CompletableFuture.completedFuture(PowerActionResult(true, "ok"))
                  override fun restart(actionKey: String, panelServerId: String): CompletionStage<PowerActionResult> =
                      CompletableFuture.completedFuture(PowerActionResult(true, "ok"))
              }

              private class FakeControl : NetworkControlPort {
                  var maintenanceEnables = 0
                  override fun broadcast(notice: RestartNotice) = Unit
                  override fun disconnectAll(notice: RestartNotice) = Unit
                  override fun transferAll(from: ServerId, destinations: List<ServerId>): CompletionStage<TransferSummary> =
                      CompletableFuture.completedFuture(TransferSummary(0, 0, 0))
                  override fun setMaintenance(enabled: Boolean, duration: Duration) {
                      if (enabled) maintenanceEnables++
                  }
                  override fun maintenanceActive(): Boolean = false
              }

              private class MemoryStore : RestartPlanStore {
                  private var saved = emptyList<RestartPlan>()
                  override fun load(): List<RestartPlan> = saved.map(::snapshot)
                  override fun save(plans: Collection<RestartPlan>) {
                      saved = plans.map(::snapshot)
                  }

                  private fun snapshot(plan: RestartPlan): RestartPlan = plan.copy(
                      announcedSeconds = ConcurrentHashMap.newKeySet<Long>().also { it += plan.announcedSeconds },
                      targetResults = ConcurrentHashMap(plan.targetResults),
                      dispatchedActionKeys = ConcurrentHashMap.newKeySet<String>().also { it += plan.dispatchedActionKeys },
                      acceptedActionKeys = ConcurrentHashMap.newKeySet<String>().also { it += plan.acceptedActionKeys },
                      baselineBootIds = ConcurrentHashMap(plan.baselineBootIds),
                  )
              }

              private companion object {
                  const val LEGACY_FAILURE =
                      "execution was interrupted after a destructive action may have started"
              }
          }
          EOF

      - name: Update recovery documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one documentation match in {path}, found {count}')
              file.write_text(text.replace(old, new))

          replace_once(
              'docs/network-restarts.md',
              '''interrupted during preflight, transfer, or dispatch are marked
          `NEEDS_REVIEW` and are never replayed automatically, preventing restart loops.
          ''',
              '''interrupted during preflight, transfer, or dispatch are marked
          `NEEDS_REVIEW` and are never replayed automatically, preventing restart loops.
          Recovery preserves terminal plans even when their durable `actionStarted`
          history remains true. On the first startup after this fix, records produced by
          the known recovery regression are repaired only when a persisted completion
          timestamp proves completion, or when the exact legacy failure has none of the
          dispatch, acceptance, boot-baseline, result, or deadline evidence written by a
          real destructive execution. Ambiguous records remain `NEEDS_REVIEW`.
          ''',
          )

          replace_once(
              'docs/requirements.md',
              '''- REQ-062: If the companion plugin is missing on the target server when a restart is requested, then the system shall refuse to arm the restart and log an error.
          ''',
              '''- REQ-062: If the companion plugin is missing on the target server when a restart is requested, then the system shall refuse to arm the restart and log an error.
          - REQ-063: During proxy startup recovery, terminal restart plans shall remain terminal regardless of historical `actionStarted` state. The system shall repair legacy `NEEDS_REVIEW` records only when a persisted completion timestamp or the complete absence of durable destructive-execution evidence proves the known recovery regression; ambiguous records shall remain `NEEDS_REVIEW`.
          ''',
          )
          PY

      - name: Validate
        run: |
          chmod +x ./gradlew
          ./gradlew :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon

      - name: Commit validated patch
        run: |
          rm .github/workflows/apply-recovery-review-fix.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt \
                  velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartRecoveryRegressionTest.kt \
                  docs/network-restarts.md docs/requirements.md \
                  .github/workflows/apply-recovery-review-fix.yml
          git commit -m "fix: stop stale review plans returning after restart"
          git push origin HEAD:${{ github.head_ref }}
