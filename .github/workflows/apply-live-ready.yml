name: apply-live-ready-security-fix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-live-ready-security-fix
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    if: github.repository == 'wsg138/EnthusiaToiletFlush'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify staged payload and untouched source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 30ca316de5098083c2b99c3ab52637335ccde001 HEAD -- . \
            ':(exclude).github/pr6-runtime/**' \
            ':(exclude).github/workflows/apply-live-ready.yml'

          cat \
            .github/pr6-runtime/live-ready-final.part00 \
            .github/pr6-runtime/live-ready-final.part01-02 \
            .github/pr6-runtime/live-ready-final.part03-04 \
            .github/pr6-runtime/live-ready-final.part05-06 \
            .github/pr6-runtime/live-ready-final.part07-08 \
            .github/pr6-runtime/live-ready-final.part09-10 \
            .github/pr6-runtime/live-ready-final.part11-12 \
            | tr -d '\r\n' > /tmp/live-ready-final.patch.gz.b64

          test "$(wc -c < /tmp/live-ready-final.patch.gz.b64)" -eq 87808
          echo '94446bb822910287d99a1a36eecc27521b295e9651928dab6ef9f03fa98476a9  /tmp/live-ready-final.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/live-ready-final.patch.gz.b64 > /tmp/live-ready-final.patch.gz
          echo '6464cb66410714bd12339d3f5497397ef765e78ab825825afe17800e34c30458  /tmp/live-ready-final.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/live-ready-final.patch.gz > /tmp/live-ready-final.patch
          echo '29927d05a9f35256797a65b45a46c2804df1ae3776d16fb3b220ded44a70d9fc  /tmp/live-ready-final.patch' | sha256sum -c -
          git apply --check /tmp/live-ready-final.patch

      - name: Apply security and lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=error-all /tmp/live-ready-final.patch
          rm -f .github/pr6-runtime/live-ready-final.patch.gz.b64
          rm -f .github/pr6-runtime/live-ready-final.part*
          rm -f .github/workflows/apply-live-ready.yml
          rmdir .github/pr6-runtime 2>/dev/null || true
          git diff --check
          test ! -e .github/workflows/apply-live-ready.yml
          test ! -d .github/pr6-runtime

      - name: Run complete validation and build both plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean \
            :velocity:check :velocity:shadowJar \
            :paper-companion:check :paper-companion:shadowJar \
            --no-daemon -PreleaseVersion=0.1.4-live-candidate
          unzip -p velocity/build/libs/velocity-0.1.4-live-candidate.jar velocity-plugin.json | grep '0.1.4-live-candidate'
          unzip -p paper-companion/build/libs/paper-companion-0.1.4-live-candidate.jar plugin.yml | grep '0.1.4-live-candidate'

      - name: Commit verified source and remove staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Enthusia repository agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'security: authenticate restart control and verify lifecycle completion'
          git push origin HEAD:main
