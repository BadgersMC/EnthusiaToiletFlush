name: apply-live-ready-security-fix-v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-live-ready-security-fix-v3
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'wsg138/EnthusiaToiletFlush'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Reconstruct verified source patch and apply follow-up
        shell: bash
        run: |
          set -euo pipefail
          base=30ca316de5098083c2b99c3ab52637335ccde001
          git diff --exit-code "$base" HEAD -- . \
            ':(exclude).github/pr6-runtime/**' \
            ':(exclude).github/workflows/apply-live-ready.yml' \
            ':(exclude).github/workflows/apply-live-ready-v2.yml' \
            ':(exclude).github/workflows/apply-live-ready-v3.yml' \
            ':(exclude).github/workflows/diagnose-patch-chunks.yml'

          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-live-ready-v2.yml').read_text()
          start = source.index('          d=.github/pr6-runtime')
          end = source.index('\n      - name: Apply fixes and remove every staging artifact', start)
          Path('/tmp/reconstruct-live-ready.sh').write_text(textwrap.dedent(source[start:end]))
          PY
          bash -euo pipefail /tmp/reconstruct-live-ready.sh
          git apply --whitespace=error-all /tmp/live-ready-final.patch

          echo '649370713e515987583ceb90fb6ba6cce5c2c65c8342526089fdfe5bc7e51c06  .github/pr6-runtime/live-ready-followup-01.patch' | sha256sum -c -
          git apply --check .github/pr6-runtime/live-ready-followup-01.patch
          git apply --whitespace=error-all .github/pr6-runtime/live-ready-followup-01.patch

          rm -rf .github/pr6-runtime
          rm -f .github/workflows/apply-live-ready.yml
          rm -f .github/workflows/apply-live-ready-v2.yml
          rm -f .github/workflows/apply-live-ready-v3.yml
          rm -f .github/workflows/diagnose-patch-chunks.yml
          git diff --check
          test ! -d .github/pr6-runtime

      - name: Run complete Gradle validation and build both plugins
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew clean \
            :velocity:check :velocity:shadowJar \
            :paper-companion:check :paper-companion:shadowJar \
            --no-daemon --console=plain --stacktrace \
            -PreleaseVersion=0.1.4-live-candidate 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            unzip -p velocity/build/libs/velocity-0.1.4-live-candidate.jar velocity-plugin.json | grep '0.1.4-live-candidate'
            unzip -p paper-companion/build/libs/paper-companion-0.1.4-live-candidate.jar plugin.yml | grep '0.1.4-live-candidate'
            status=$?
          fi
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "gradle_exit=$status"
            echo
            echo '=== matched failure lines ==='
            grep -nE '(^e: |^FAILURE:|^\* What went wrong:|Execution failed for task|> Task .*FAILED| FAILED$|Caused by:|AssertionError|Compilation error|There were failing tests)' /tmp/gradle.log | tail -n 250 || true
            echo
            echo '=== failing test XML ==='
            grep -R -n -E '<failure|<error' velocity/build/test-results paper-companion/build/test-results 2>/dev/null | head -n 300 || true
            echo
            echo '=== log tail ==='
            tail -n 350 /tmp/gradle.log
          } > /tmp/gradle-failure.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failure evidence only
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .github/pr6-runtime
          cp /tmp/gradle-failure.txt .github/pr6-runtime/gradle-failure.txt
          git config user.name 'Enthusia repository agent'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/pr6-runtime/gradle-failure.txt
          git commit -m 'chore: capture next live-readiness Gradle failure'
          git push origin HEAD:main

      - name: Fail after preserving evidence
        if: steps.gradle.outputs.status != '0'
        run: exit 1

      - name: Publish verified source to the existing PR branch
        if: steps.gradle.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Enthusia repository agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'security: authenticate restart control and verify lifecycle completion'
          git push origin HEAD:main
