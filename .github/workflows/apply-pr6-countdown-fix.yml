name: validate PR 6 countdown reliability fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Apply reviewed runtime patch
        shell: bash
        run: |
          cat .github/pr6-runtime/patch00 .github/pr6-runtime/patch01 .github/pr6-runtime/patch02 .github/pr6-runtime/patch03 \
            | base64 --decode | gzip -dc > /tmp/patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/patch.py')
          source = path.read_text()
          source = source.replace(
              'plans.joinToString("\\n", postfix = if (plans.isEmpty()) "" else "\\n", transform = ::encode)',
              'plans.joinToString("\\\\n", postfix = if (plans.isEmpty()) "" else "\\\\n", transform = ::encode)',
          )
          path.write_text(source)
          PY
          python /tmp/patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/infrastructure/config/ConfigurateConfigAdapterTest.kt')
          source = path.read_text()
          source = source.replace(
              '.replace("message: "<gold>warning"", "message: "<aqua>reloaded"")',
              '.replace("message: \\"<gold>warning\\"", "message: \\"<aqua>reloaded\\"")',
          )
          path.write_text(source)
          PY
          rm -f /tmp/patch.py
          rm -rf .github/pr6-runtime
          rm -f .github/workflows/apply-pr6-countdown-fix.yml
      - name: Validate modified tree
        shell: bash
        run: |
          chmod +x ./gradlew
          git diff --check
          ./gradlew clean --no-daemon
          ./gradlew :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon
      - name: Inspect packaged plugin metadata
        shell: bash
        run: |
          velocity_jar="$(find velocity/build/libs -maxdepth 1 -type f -name 'velocity-*.jar' ! -name '*plain*' | head -n 1)"
          paper_jar="$(find paper-companion/build/libs -maxdepth 1 -type f -name 'paper-companion-*.jar' ! -name '*plain*' | head -n 1)"
          test -n "$velocity_jar"
          test -n "$paper_jar"
          unzip -p "$velocity_jar" velocity-plugin.json | tee /tmp/velocity-plugin.json
          unzip -p "$paper_jar" plugin.yml | tee /tmp/paper-plugin.yml
          grep -F '"version": "0.1.0-SNAPSHOT"' /tmp/velocity-plugin.json
          grep -F 'version: 0.1.0-SNAPSHOT' /tmp/paper-plugin.yml
      - name: Package validated source tree
        shell: bash
        run: |
          mkdir -p /tmp/pr6-final/tree
          git diff --name-status > /tmp/pr6-final/manifest.txt
          while IFS=$'\t' read -r status path; do
            case "$status" in
              D*) ;;
              *) cp --parents "$path" /tmp/pr6-final/tree ;;
            esac
          done < /tmp/pr6-final/manifest.txt
          cp /tmp/velocity-plugin.json /tmp/pr6-final/
          cp /tmp/paper-plugin.yml /tmp/pr6-final/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-validated-source
          path: /tmp/pr6-final
          if-no-files-found: error
          retention-days: 1
