name: Apply recovery review follow-up

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'wsg138/EnthusiaToiletFlush' && github.head_ref == 'agent/fix-stale-review-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply harsh-review hardening
        run: python3 .github/recovery-review-followup/apply.py

      - name: Validate
        run: |
          chmod +x ./gradlew
          ./gradlew :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon

      - name: Commit source-only hardening
        run: |
          rm -rf .github/recovery-review-followup .github/workflows/apply-recovery-review-followup.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartService.kt \
                  velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/application/network/NetworkRestartRecoveryRegressionTest.kt \
                  docs/network-restarts.md docs/requirements.md \
                  .github/recovery-review-followup .github/workflows/apply-recovery-review-followup.yml
          git commit -m "test: harden stale review migration boundary"
          git push origin HEAD:${{ github.head_ref }}
