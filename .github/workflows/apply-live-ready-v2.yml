name: apply-live-ready-security-fix-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-live-ready-security-fix-v2
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    if: github.repository == 'wsg138/EnthusiaToiletFlush'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          base=30ca316de5098083c2b99c3ab52637335ccde001
          git diff --exit-code "$base" HEAD -- . \
            ':(exclude).github/pr6-runtime/**' \
            ':(exclude).github/workflows/apply-live-ready.yml' \
            ':(exclude).github/workflows/apply-live-ready-v2.yml' \
            ':(exclude).github/workflows/diagnose-patch-chunks.yml'

          d=.github/pr6-runtime
          mkdir -p /tmp/live-ready-chunks
          cp "$d/live-ready-final.part00" /tmp/live-ready-chunks/chunk00
          cp "$d/live-ready-final.chunk01" /tmp/live-ready-chunks/chunk01
          cp "$d/live-ready-final.chunk02" /tmp/live-ready-chunks/chunk02
          cp "$d/live-ready-final.chunk03" /tmp/live-ready-chunks/chunk03
          tr -d '\r\n' < "$d/live-ready-final.part03-04" > /tmp/pair03-04
          tr -d '\r\n' < "$d/live-ready-final.part05-06" > /tmp/pair05-06
          tr -d '\r\n' < "$d/live-ready-final.part07-08" > /tmp/pair07-08
          tr -d '\r\n' < "$d/live-ready-final.part09-10" > /tmp/pair09-10
          dd if=/tmp/pair03-04 of=/tmp/live-ready-chunks/chunk04 bs=1 skip=7000 count=7000 status=none
          dd if=/tmp/pair05-06 of=/tmp/live-ready-chunks/chunk05 bs=1 count=7000 status=none
          dd if=/tmp/pair05-06 of=/tmp/live-ready-chunks/chunk06 bs=1 skip=7000 count=7000 status=none
          dd if=/tmp/pair07-08 of=/tmp/live-ready-chunks/chunk07 bs=1 count=7000 status=none
          cp "$d/live-ready-final.chunk08" /tmp/live-ready-chunks/chunk08
          dd if=/tmp/pair09-10 of=/tmp/live-ready-chunks/chunk09 bs=1 count=7000 status=none
          cp "$d/live-ready-final.chunk10" /tmp/live-ready-chunks/chunk10
          cp "$d/live-ready-final.chunk11" /tmp/live-ready-chunks/chunk11
          cp "$d/live-ready-final.chunk12" /tmp/live-ready-chunks/chunk12

          cat > /tmp/chunk-checks <<'CHECKS'
          8f4b758921624564b3cd0bb4e362310da3c961d1b99fb03842f0dc3c2ee774c3  /tmp/live-ready-chunks/chunk00
          1965a1706693687f402f2d517fdb9be2a1867f2c8150d98a6a5e4c8ae697f5d0  /tmp/live-ready-chunks/chunk01
          3c2465db84b3547e84d963f3332347d3f9479c8c6b9e54a2b172787efe79e805  /tmp/live-ready-chunks/chunk02
          43d32883ee46d6946c6668480eaa66f796b93d9861a4d8d8eaaec75f71763be1  /tmp/live-ready-chunks/chunk03
          7007b79c37fe5ab5043a58a5ea1c952f8a646f42ab6bda8c58da948af31d2b8a  /tmp/live-ready-chunks/chunk04
          d6eeb093b0d7f3902a137f390d7a0b395c55d35840a4be677c5030eadc5668cc  /tmp/live-ready-chunks/chunk05
          291a4141290bc9f7afd1641f89516699d67e4bd99737b01ee553bf8142dd4186  /tmp/live-ready-chunks/chunk06
          cf3d03b40d7f6f95d0aa3f56438b52e14b95fb9d22bb247905c55cf37af485d7  /tmp/live-ready-chunks/chunk07
          78894579cd8c04e9a61ccb3d40b7a10faf9277cb44d4103b0a020505f27f903d  /tmp/live-ready-chunks/chunk08
          1f56e72084c216190905849f95e23eca0a11bc95ac9127897409b97a2fa1dd61  /tmp/live-ready-chunks/chunk09
          f69b653e25c5493214913e1b404d95d4f84c912d36d30c377c0a4952688155a0  /tmp/live-ready-chunks/chunk10
          9e0e37b8dc7f521e7e36c285e0f534cea63e3b1bb84cdac5497ec0fd3b440429  /tmp/live-ready-chunks/chunk11
          c605e0e8ba8116f45ed8841d06174f41bcf9de209b3f4db16ca3e56f370085a0  /tmp/live-ready-chunks/chunk12
          CHECKS
          sed -i 's/^          //' /tmp/chunk-checks
          sha256sum -c /tmp/chunk-checks
          test "$(wc -c < /tmp/live-ready-chunks/chunk12)" -eq 3808
          for i in $(seq -w 0 11); do test "$(wc -c < /tmp/live-ready-chunks/chunk$i)" -eq 7000; done

          cat /tmp/live-ready-chunks/chunk* > /tmp/live-ready-final.patch.gz.b64
          test "$(wc -c < /tmp/live-ready-final.patch.gz.b64)" -eq 87808
          echo '94446bb822910287d99a1a36eecc27521b295e9651928dab6ef9f03fa98476a9  /tmp/live-ready-final.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/live-ready-final.patch.gz.b64 > /tmp/live-ready-final.patch.gz
          echo '6464cb66410714bd12339d3f5497397ef765e78ab825825afe17800e34c30458  /tmp/live-ready-final.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/live-ready-final.patch.gz > /tmp/live-ready-final.patch
          echo '29927d05a9f35256797a65b45a46c2804df1ae3776d16fb3b220ded44a70d9fc  /tmp/live-ready-final.patch' | sha256sum -c -
          git apply --check /tmp/live-ready-final.patch

      - name: Apply fixes and remove every staging artifact
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=error-all /tmp/live-ready-final.patch
          rm -rf .github/pr6-runtime
          rm -f .github/workflows/apply-live-ready.yml
          rm -f .github/workflows/apply-live-ready-v2.yml
          rm -f .github/workflows/diagnose-patch-chunks.yml
          git diff --check
          test ! -d .github/pr6-runtime
          test ! -e .github/workflows/apply-live-ready.yml
          test ! -e .github/workflows/apply-live-ready-v2.yml
          test ! -e .github/workflows/diagnose-patch-chunks.yml

      - name: Run complete validation and build both plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean \
            :velocity:check :velocity:shadowJar \
            :paper-companion:check :paper-companion:shadowJar \
            --no-daemon -PreleaseVersion=0.1.4-live-candidate
          unzip -p velocity/build/libs/velocity-0.1.4-live-candidate.jar velocity-plugin.json | grep '0.1.4-live-candidate'
          unzip -p paper-companion/build/libs/paper-companion-0.1.4-live-candidate.jar plugin.yml | grep '0.1.4-live-candidate'

      - name: Publish verified source to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Enthusia repository agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'security: authenticate restart control and verify lifecycle completion'
          git push origin HEAD:main
